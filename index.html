.card{position:relative;border-radius:14px;border:1px solid var(--border);

.card-i:hover{transform:translateY(-3px);border-color:rgba(var(--acc-rgb),.5);

.btn-p{color:#08040f;background:linear-gradient(180deg,rgba(var(--acc-rgb),1),rgba(var(--acc-rgb),.78));

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes bootbar{0%{width:0}100%{width:100%}}
@keyframes ring{0%{transform:scale(.5);opacity:.85}100%{transform:scale(2);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pulse{animation:pulse 2s ease-in-out infinite}
.rise,.stg>*{opacity:0;animation:rise .55s var(--ease) forwards}
.stg>:nth-child(1){animation-delay:.04s}.stg>:nth-child(2){animation-delay:.1s}.stg>:nth-child(3){animation-delay:.16s}
.stg>:nth-child(4){animation-delay:.22s}.stg>:nth-child(5){animation-delay:.28s}.stg>:nth-child(6){animation-delay:.34s}
.pop{animation:pop .3s var(--ease) both}
.flt{animation:float 6s ease-in-out infinite}
.marq{animation:marq 34s linear infinite}
.will{will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.rise,.stg>*{animation-duration:.01ms}.marq{animation:none}}
#err{position:fixed;left:12px;right:12px;bottom:12px;z-index:200;display:none;padding:14px;border-radius:12px;

            <div className="flex gap-2"><select className="inp w-24" value={s.pre} onChange={e=>setS({pre:e.target.value})}>{PREFIXES.map(p=><option key={p}>{p}</option>)}</select><input className="inp" placeholder={t('checkout.phone')} value={s.phone} onChange={e=>setS({phone:e.target.value})}/></div></div></div>
          <div><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cour')}</p>
            <div className="mt-2 grid gap-2 sm:grid-cols-2">{SHIPPERS.map(c=><button key={c} onClick={()=>setS({cour:c})} className={cx('rounded-lg border p-3 text-left transition-all',s.cour===c?'border-tor/70 bg-tor/10':'border-line hover:border-white/30')}><p className="mono text-xs text-white">{c}</p><p className="mono text-[9px] text-white/35">{t('checkout.sh.'+sm[c])[0]} · {t('checkout.sh.'+sm[c])[1]}</p></button>)}</div>
            {s.cour==='LOCKER INPOST'&&<input className="inp mt-2" placeholder={t('checkout.locker')} value={s.locker} onChange={e=>setS({locker:e.target.value})}/>}</div>
        </div>
        {err&&<p className="mono mt-3 text-xs text-magenta">{err}</p>}
        <Btn cls="mt-4 w-full" onClick={()=>{if(!s.addr||!s.num||!s.zip||!s.city||!s.email||!s.phone||!s.cour){setErr(t('checkout.fill'));return}setErr('');setStep(2)}}>{t('checkout.go')}</Btn></Card>
    </div>}

    {step===2&&<div className="space-y-4">
      <Card><h2 className="font-bold text-white">{t('checkout.s2')}</h2><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.sub2')}</p>
        <div className="mt-4 space-y-3">
          <button onClick={()=>{setOrder(o=>({...o,method:'crypto'}));setSub('cq')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='crypto'?'border-cyan/70 bg-cyan/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.crypto')}</span><span className="badge">{t('checkout.nofee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.csub')}</p><p className="mono mt-1 text-[9px] text-cyan">{t('checkout.cbadge')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'bonifico'}));setSub('bon')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='bonifico'?'border-tor/70 bg-tor/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.bon')}</span><span className="badge">{t('checkout.bfee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.bsub')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'amazon'}));setSub('aq')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='amazon'?'border-amber/70 bg-amber/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.amz')}</span><span className="badge">{t('checkout.afee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.asub')}</p></button>
        </div></Card>
      {sub==='cq'&&<Card><h3 className="font-bold text-white">{t('checkout.cq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.cq.2')}</Btn><Btn v="o" cls="flex-1" onClick={()=>setSub('cg')}>{t('checkout.cq.3')}</Btn></div></Card>}
      {sub==='cg'&&<Card><h3 className="font-bold text-white">{t('checkout.cg.0')}</h3><ol className="mt-3 space-y-2">{t('checkout.cg').slice(1,5).map((x,i)=><li key={i} className="flex gap-2 text-sm text-white/60"><span className="mono text-cyan">{i+1}.</span>{x}</li>)}</ol><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.cg.5')}</Btn></Card>}
      {sub==='aq'&&<Card><h3 className="font-bold text-white">{t('checkout.aq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.aq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.aq.2')}</Btn><Btn v="o" cls="flex-1" onClick={()=>setSub('ag')}>{t('checkout.aq.3')}</Btn></div></Card>}
      {sub==='ag'&&<Card><h3 className="font-bold text-white">{t('checkout.ag.0')}</h3><p className="mt-2 text-sm text-white/55">{t('checkout.ag.1')}</p><p className="mono mt-2 text-[10px] text-amber">{t('checkout.ag.2')}</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.ag.3')}</Btn></Card>}
      {sub==='bon'&&<Card><h3 className="font-bold text-white">{t('checkout.bon')}</h3><p className="mt-2 text-sm text-white/55">{t('checkout.bfee')} · SEPA</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>OK</Btn></Card>}
      {sub==='conf'&&<Card>
        <h3 className="font-bold text-white">{t('checkout.conf')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.rate')}</p>
        {order.method==='crypto'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.net')}</p>
          <div className="mt-2 flex gap-2">{['USDT','BTC','LTC'].map(n=><button key={n} onClick={()=>setOrder(o=>({...o,coin:n}))} className={cx('flex-1 rounded-lg border p-3 mono text-xs',order.coin===n?'border-cyan/70 bg-cyan/10 text-cyan':'border-line text-white/60')}>{n}</button>)}</div>
          {order.coin&&<div className="mt-3 rounded-lg border border-line bg-black/40 p-3"><p className="mono text-[9px] tracking-widest text-white/40">{t('checkout.send')}</p><p className="mono break-all text-xs text-cyan">{WALLETS[order.coin]}</p>
            <button onClick={async()=>{await cp(WALLETS[order.coin]);tm('Copiato')}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-cyan">{t('c.copy')}</button></div>}</div>}
        {order.method==='amazon'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-white/40">CODICE BUONO</p><input className="inp mt-2" placeholder="XXXX-XXXX-XXXX-XXX" onChange={e=>setOrder(o=>({...o,voucher:e.target.value.toUpperCase()}))}/></div>}
        <div className="mt-4 space-y-1 border-t border-line pt-3">
          <div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.sub')}</span><span className="mono text-white">{money(total,lang)}</span></div>
          {order.method==='bonifico'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.bfeeL')}</span><span className="mono text-white">+{money(total*.1,lang)}</span></div>}
          {order.method==='amazon'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.vfeeL')}</span><span className="mono text-white">+{money(total*.2,lang)}</span></div>}
          <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('checkout.pay')}</span><span className="mono text-lg font-bold text-neon">{money(fin,lang)}</span></div>
        </div>
        <Btn cls="mt-4 w-full" onClick={confirm}>{t('checkout.conf')}</Btn>
      </Card>}
    </div>}

    {step===3&&<Card cls="relative text-center"><Brk/>
      <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-neon/15 text-2xl text-neon">✓</div>
      <h1 className="text-xl font-bold text-white">{t('checkout.done')}</h1><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.doneS')}</p>
      <div className="mt-4 rounded-xl border border-neon/30 bg-neon/5 p-4"><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.code')}</p><p className="mono mt-1 text-2xl font-bold tracking-widest text-neon">{code}</p>
        <button onClick={async()=>{await cp(code);tm('Copiato')}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-neon">{t('checkout.cc')}</button></div>
      <p className="mono mt-4 text-[10px] tracking-widest text-white/40">{t('checkout.wait')}</p>
      <div className="mt-4 flex flex-wrap justify-center gap-2"><a href={TG} target="_blank" rel="noreferrer"><Btn>{t('checkout.ct')}</Btn></a><Btn v="o" onClick={()=>{clear();nav('/node')}}>{t('checkout.back')}</Btn></div>
      <p className="mt-4 text-xs text-white/45">{t('checkout.warn')}</p>
    </Card>}
  </div>);
}

/* ================= APP ================= */
function Router(){
  const p=useRoute();const seg=p.split('/').filter(Boolean);const r=seg[0];
  if(!r)return <Boot/>;
  if(r==='gate')return <Gate/>;
  if(!sessionStorage.getItem('ge-in')&&r!=='gate'){ /* forza gate se non autenticato */ }
  let page;
  if(r==='node')page=<Node_/>;
  else if(r==='cash')page=<Cash/>;
  else if(r==='paypal')page=<Paypal/>;
  else if(r==='quality')page=<Quality/>;
  else if(r==='feedback')page=<Feedback/>;
  else if(r==='faq')page=<Faq/>;
  else if(r==='privacy'||r==='terms'||r==='cookies')page=<Legal doc={r}/>;
  else if(r==='checkout')page=<Checkout/>;
  else page=<Node_/>;
  return(<><Header/>{page}<Footer/><Cart/></>);
}
function Toast(){const{toast}=useApp();if(!toast)return null;
  return <div className="pop fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-full border border-tor/50 bg-surface/95 px-5 py-2.5 mono text-[11px] uppercase tracking-widest text-tor backdrop-blur-xl">{toast}</div>}
function Fab(){return <a href={TG} target="_blank" rel="noreferrer" aria-label="Telegram" className="fixed bottom-6 right-5 z-[80] flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-tor to-cyan text-black shadow-[0_10px_34px_-8px_rgba(176,38,255,.9)] transition-transform hover:scale-105"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.5z"/></svg></a>}
function App(){return(<Prov><Router/><Toast/><Fab/></Prov>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
